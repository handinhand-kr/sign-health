<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>환자 화면</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 공통 바탕 (세 화면 동일) */
      --bg: #f5f6f8; --surface: #ffffff; --surface2: #f9fafb; --border: #e3e6ec;
      --fg: #111827; --fg2: #374151; --fg3: #6b7280; --fg4: #9ca3af;
      --statusbar: #1f2430; --statusbar-fg: #c9d0e0;
      /* 역할 색 (세 화면 동일): 환자 연두 · 간호사 연보라~분홍 · 의사 파랑 */
      --patient: #424d63; --patient-strong: #2b354a; --patient-soft: #7d889e;
      --patient-border: #c9d1e1; --patient-bg: #f0f3fa; --patient-chip: #dfe5f1;
      --doctor-rgb: 58,101,184; --nurse-rgb: 145,74,140;
      --patient-rgb: 66,77,99;
      --nurse: #914a8c; --nurse-strong: #672e63; --nurse-soft: #cc8bc5;
      --nurse-border: #efcfeb; --nurse-bg: #fdf3fc;
      --doctor: #3a65b8; --doctor-strong: #254582; --doctor-soft: #7fa4ea;
      --doctor-border: #c9dcfd; --doctor-bg: #f1f7ff;
      /* 경고(빨강) · 강조 표시(노랑) */
      --red: #b91c1c; --red-bg: #fef2f2;
      --emph: #78350f; --emph-bg: #fde68a;
      /* 이 화면의 기본 색 = 환자 */
      --accent: var(--patient); --accent-strong: var(--patient-strong);
      --accent-bg: var(--patient-bg); --accent-border: var(--patient-border);
      /* 예전 이름 호환: green = 환자, blue = 의사 */
      --green: var(--patient); --green-bg: var(--patient-bg); --green-border: var(--patient-border);
      --blue: var(--doctor); --blue-bg: var(--doctor-bg); --blue-border: var(--doctor-border);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      height: 100%;
      font-size: 14px;
      overflow: hidden;
    }

    /* Top nav */
    .topnav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .topnav-left { display: flex; align-items: center; gap: 16px; }
    .app-name { font-size: 15px; font-weight: 700; color: var(--fg); letter-spacing: -0.02em; }
    .app-name span { color: var(--accent); }
    .nav-divider { width: 1px; height: 18px; background: var(--border); }
    .role-badge { display: flex; align-items: center; gap: 8px; }
    .role-tag {
      background: var(--green); color: white;
      font-size: 11px; font-weight: 700;
      padding: 3px 9px; border-radius: 4px; letter-spacing: 0.04em;
    }
    .dept-tag {
      background: var(--green-bg); border: 1px solid var(--green-border);
      color: var(--green); font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 4px;
    }

    /* Layout */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 480px;
      min-height: 0;
      gap: 0;
    }

    /* Left: camera panel */
    .camera-panel {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      min-height: 0;
    }

    .camera-row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      flex-shrink: 0;
    }
    .camera-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      flex-shrink: 0;
      aspect-ratio: 4/3;
      width: 70%;
      max-height: none;
    }
    .patient-info-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }
    .pi-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--accent-bg); border: 1px solid var(--accent-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: var(--accent); flex-shrink: 0;
    }
    .pi-name { font-size: 15px; font-weight: 700; color: var(--fg); letter-spacing: -0.02em; }
    .pi-meta { font-size: 11px; color: var(--fg3); margin-top: 1px; }
    .pi-divider { height: 1px; background: var(--border); }
    .pi-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 3px 0;
    }
    .pi-key { font-size: 10px; color: var(--fg4); font-weight: 500; }
    .pi-val { font-size: 12px; font-weight: 700; color: var(--fg2); }
    .pi-val.red { color: #b91c1c; }
    .pi-bp {
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 8px; padding: 8px 10px; text-align: center;
    }
    .pi-bp-val { font-size: 20px; font-weight: 700; color: #b91c1c; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    .pi-bp-label { font-size: 9px; color: #b91c1c; font-weight: 500; letter-spacing: 0.04em; margin-top: 1px; }
    .pi-badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 4px; letter-spacing: 0.03em;
    }
    .pi-badge.dept { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); }
    .pi-badge.disability { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
    .live-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(220, 38, 38, 0.92);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 10;
    }
    .live-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: livePulse 1.2s ease-in-out infinite;
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    #camera {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .camera-svg {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* Recognition result */
    .recog-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
      flex-shrink: 0;
    }
    .recog-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--fg4); flex-shrink: 0;
      transition: background 0.3s;
    }
    .recog-dot.detecting { background: #f59e0b; animation: pulse 1s infinite; }
    .recog-dot.confirmed { background: var(--green); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .recog-main { flex: 1; }
    .recog-label { font-size: 10px; font-weight: 600; color: var(--fg4); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 3px; }
    .recog-text { font-size: 22px; font-weight: 700; color: var(--fg3); letter-spacing: -0.02em; }
    .recog-text.detecting { color: #d97706; }
    .recog-text.confirmed { color: var(--green); }
    .recog-progress {
      font-size: 10px; color: var(--fg4); margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }

    /* Gesture guide */
    .gesture-guide {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      max-height: 220px;
    }
    #gestureRankList {
      overflow-y: auto;
      flex: 1;
    }
    .gesture-guide-header {
      padding: 8px 14px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .gesture-guide-label {
      font-size: 10px; font-weight: 600; color: var(--fg3);
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .gesture-guide-note {
      font-size: 10px; color: var(--accent); font-weight: 500;
    }
    .gesture-row {
      padding: 7px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
      transition: background 0.15s;
    }
    .gesture-row:last-child { border-bottom: none; }
    .gesture-row.top1 { background: var(--accent-bg); }
    .gesture-status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--border); flex-shrink: 0;
      transition: background 0.2s;
    }
    .gesture-status-dot.active { background: var(--accent); }
    .gesture-code {
      font-size: 13px; font-weight: 700; color: var(--fg);
      min-width: 52px; letter-spacing: -0.01em;
    }
    .gesture-bar-wrap {
      flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
    }
    .gesture-bar {
      height: 100%; background: var(--accent); border-radius: 2px;
      transition: width 0.15s ease;
    }
    .gesture-pct {
      font-size: 10px; font-weight: 600; color: var(--fg3);
      min-width: 32px; text-align: right; font-variant-numeric: tabular-nums;
    }
    .gesture-hint { display: none; }

    /* Right: message panel */
    .message-panel {
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow-y: auto;
      min-height: 0;
    }
    .msg-section {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }
    .msg-section:last-child { border-bottom: none; }
    .msg-section-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--fg4); margin-bottom: 10px;
    }

    /* Doctor message */
    .doctor-msg-box {
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      border-radius: 8px; padding: 12px 14px;
    }
    .doctor-msg-label { font-size: 10px; font-weight: 600; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
    .doctor-msg-text {
      font-size: 22px; font-weight: 600; color: #111827;
      letter-spacing: -0.01em; line-height: 1.7;
    }
    .doctor-msg-text .emph {
      font-size: 1.36em;
      font-weight: 900;
      color: var(--emph);
      background: var(--emph-bg);
      border-radius: 5px;
      padding: 1px 5px;
    }
    .doctor-msg-time { font-size: 10px; color: #3b82f6; margin-top: 4px; font-variant-numeric: tabular-nums; }

    /* Received history */
    .recv-row {
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .recv-row:last-child { border-bottom: none; }
    .recv-sender {
      font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
      padding: 2px 6px; border-radius: 4px; flex-shrink: 0;
    }
    .recv-sender.doctor { background: #eff6ff; color: #1d4ed8; }
    .recv-sender.nurse  { background: #f0fdfa; color: #0f766e; }
    .recv-text { font-size: 14px; font-weight: 500; color: var(--fg2); flex: 1; }
    .recv-time { font-size: 10px; color: var(--fg4); font-variant-numeric: tabular-nums; }

    /* Patient sent */
    .patient-sent-row {
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 2px;
    }
    .patient-sent-row:last-child { border-bottom: none; }
    .patient-sent-text { font-size: 15px; font-weight: 700; color: var(--green); }
    .patient-sent-meta { font-size: 10px; color: var(--fg4); font-variant-numeric: tabular-nums; }

    /* Status bar */
    .statusbar {
      background: var(--statusbar); color: var(--statusbar-fg);
      height: 28px; display: flex; align-items: center;
      padding: 0 16px; gap: 20px; flex-shrink: 0;
      font-size: 11px; font-variant-numeric: tabular-nums;
    }
    .statusbar-item { display: flex; align-items: center; gap: 6px; }
    .status-dot-sm { width: 5px; height: 5px; border-radius: 50%; background: #6b7280; }
    .status-dot-sm.connected { background: #22c55e; }
    .statusbar-divider { width: 1px; height: 12px; background: rgba(255,255,255,0.15); }
    .statusbar-spacer { flex: 1; }

    /* Firebase 오류 안내 */
    .fb-error {
      position: fixed; left: 50%; top: 64px; transform: translateX(-50%);
      z-index: 1000; width: min(560px, calc(100% - 32px));
      background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b;
      padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.55;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }
    .fb-error b { display: block; font-size: 14px; margin-bottom: 2px; }
    .fb-error code { background: #fee2e2; padding: 0 4px; border-radius: 3px; font-size: 12px; }

    /* 문장 만들기 (단어 + 숫자) */
    .sb-body { display: flex; flex-direction: column; gap: 10px; }
    .sb-words {
      min-height: 46px; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      background: var(--surface2); border: 1px dashed var(--border); border-radius: 8px;
    }
    .sb-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--green-bg); border: 1px solid var(--green-border); color: var(--green);
      font-size: 16px; font-weight: 700; padding: 4px 6px 4px 10px; border-radius: 6px;
    }
    .sb-chip button {
      border: none; background: none; color: var(--green); font-size: 16px; line-height: 1;
      width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-family: inherit;
    }
    .sb-chip button:hover { background: var(--green-border); }
    .sb-preview {
      min-height: 52px; padding: 8px 12px;
      background: var(--accent-bg); border: 1px solid var(--accent-border); border-radius: 8px;
      display: flex; flex-direction: column; justify-content: center; gap: 2px;
    }
    .sb-preview-text { font-size: 20px; font-weight: 700; color: var(--fg); letter-spacing: -0.01em; }
    .sb-preview.empty .sb-preview-text { font-size: 13px; font-weight: 500; color: var(--fg4); }
    .sb-preview-note { font-size: 11px; color: var(--accent); }
    .sb-preview-note.warn { color: #b45309; }
    .num-grid, .num-units { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .num-btn {
      height: 46px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--fg);
      font-family: inherit; font-size: 20px; font-weight: 700; cursor: pointer;
      font-variant-numeric: tabular-nums; transition: background 0.12s, border-color 0.12s;
    }
    .num-btn:hover { background: var(--surface2); }
    .num-btn:active { background: var(--accent-bg); }
    .num-btn.unit { font-size: 16px; }
    .num-btn.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
    .num-actions { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 6px; }
    .num-action {
      height: 44px; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--fg3);
    }
    .num-action.send { background: var(--green); border-color: var(--green); color: #fff; font-size: 16px; }
    .num-action.send:disabled { background: var(--border); border-color: var(--border); color: var(--fg4); cursor: default; }

    /* ===== 색 통일 (공통) ===== */
    .topnav { border-bottom: 2px solid var(--accent-border); }
    .status-dot-sm.connected { background: #22c55e; }
    .staff-meta b.nurse { color: var(--nurse); }
    .staff-meta b.doctor { color: var(--doctor); }
    .staff-bubble.nurse { background: var(--nurse-bg); border-color: var(--nurse-border); color: var(--nurse-strong); }
    .staff-bubble.doctor { background: var(--doctor-bg); border-color: var(--doctor-border); color: var(--doctor-strong); }
    .patient-msg-time { color: var(--patient); }

    /* 받은 메시지는 보낸 사람 색으로 (의사 파랑 / 간호사 연보라) */
    .doctor-msg-box { --from: var(--doctor); --from-bg: var(--doctor-bg); --from-border: var(--doctor-border);
                      background: var(--from-bg); border-color: var(--from-border); }
    .doctor-msg-box.from-nurse { --from: var(--nurse); --from-bg: var(--nurse-bg); --from-border: var(--nurse-border); }
    .doctor-msg-label, .doctor-msg-time { color: var(--from); }
    .recv-sender.doctor { background: var(--doctor-bg); color: var(--doctor); }
    .recv-sender.nurse  { background: var(--nurse-bg); color: var(--nurse); }

    /* ===== v7: 머리글·라벨을 진하고 크게 ===== */
    .app-name { font-size: 18px; }
    .role-tag { font-size: 13px; padding: 4px 11px; }
    .pi-name { font-size: 17px; }
    .pi-meta { font-size: 13px; color: var(--fg); }
    .pi-badge { font-size: 12px; }
    .pi-key { font-size: 12px; color: var(--fg2); font-weight: 600; }
    .pi-val { font-size: 14px; color: var(--fg); }
    .pi-bp-label { font-size: 11px; }
    .recog-label, .msg-section-label, .gesture-guide-label {
      font-size: 13px; font-weight: 700; color: var(--fg); letter-spacing: 0; text-transform: none;
    }
    .gesture-guide-note { font-size: 12px; color: var(--fg2); }
    .gesture-code { font-size: 15px; }
    .gesture-pct { font-size: 12px; color: var(--fg2); }
    .doctor-msg-label { font-size: 13px; font-weight: 700; color: var(--fg); letter-spacing: 0; text-transform: none; }
    .doctor-msg-time { font-size: 12px; color: var(--fg2); }
    .recv-sender { font-size: 12px; }
    .recv-text { font-size: 16px; color: var(--fg); }
    .recv-time { font-size: 12px; color: var(--fg3); }
    .patient-sent-text { font-size: 17px; }
    .patient-sent-meta { font-size: 12px; color: var(--fg3); }
    /* 밝은 연두: 단어 칩은 조금 더 진한 연두 바탕 */
    .sb-chip { background: var(--patient-chip); color: var(--patient-strong); }
    /* 보낼 문장이 없을 때는 미리보기 칸을 숨김 */
    .sb-preview.empty { display: none; }

    /* ===== v8: 글씨 조금 키우기 (화면 전체 8% 확대) ===== */
    html { zoom: 1.08; }
    /* 새 메시지 도착 시 반짝임 (소리 대신 시각 알림) */
    @keyframes msgFlash {
      0%   { box-shadow: 0 0 0 0 rgba(var(--flash-rgb), 0); }
      15%  { box-shadow: 0 0 0 6px rgba(var(--flash-rgb), 0.45); }
      100% { box-shadow: 0 0 0 0 rgba(var(--flash-rgb), 0); }
    }
    .flash { animation: msgFlash 1.6s ease-out 1; }
    /* 의료진 메시지: 보낸 사람 색의 왼쪽 굵은 띠 + 도착 시 반짝임 */
    .doctor-msg-box { border-left: 6px solid var(--from); --flash-rgb: var(--doctor-rgb); }
    .doctor-msg-box.from-nurse { --flash-rgb: var(--nurse-rgb); }
  </style>
</head>
<body>

<div class="fb-error" id="fbError" hidden></div>

<div class="topnav">
  <div class="topnav-left">
    <div class="app-name">Sign<span>Health</span></div>
    <div class="nav-divider"></div>
    <div class="role-badge">
      <span class="role-tag">환자</span>
    </div>
  </div>
</div>

<div class="main">

  <!-- Left: Camera + gesture guide -->
  <div class="camera-panel">

    <div class="camera-row">
      <div class="camera-wrap">
        <div class="live-badge">LIVE</div>
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="tmCanvas" width="224" height="224" style="display:none;"></canvas>
        <svg class="camera-svg" viewBox="0 0 320 240" preserveAspectRatio="xMidYMid meet">
          <ellipse id="silhouette-head" cx="160" cy="60" rx="35" ry="42"
            fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-dasharray="6,4"/>
          <path id="silhouette-shoulder" d="M100,110 Q160,95 220,110"
            fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-dasharray="6,4"/>
          <path id="silhouette-body" d="M100,110 L90,200 M220,110 L230,200"
            fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-dasharray="6,4"/>
          <text x="160" y="228" text-anchor="middle"
            fill="rgba(255,255,255,0.8)" font-size="11" font-family="sans-serif">

      <!-- 환자 정보 카드 -->
      <div class="patient-info-card">

  <div class="message-panel">

        <div class="doctor-msg-text" id="doctorMsgText" style="line-height:1.5;">대기 중...</div>
        <div class="doctor-msg-time" id="doctorMsgTime">—</div>

    <!-- 문장 만들기: 수어 단어 + 숫자 -->
    <div class="msg-section">
      <div class="sb-body">

          <button class="num-action" type="button" id="sbClear">초기화</button>
          <button class="num-action send" type="button" id="sbSend" disabled>보내기</button>

    <div class="msg-section">
      <div class="msg-section-label">수신 내역</div>

        <div style="font-size:12px;color:var(--fg4);">수신 내역 없음</div>

    <div class="msg-section">
      <div class="msg-section-label">보낸 메시지</div>
      <div id="sentHistory">
        <div style="font-size:12px;color:var(--fg4);">전송 내역 없음</div>

<div class="statusbar">
  <div class="statusbar-item">
    <div class="status-dot-sm" id="fbDot"></div>
    <span id="fbStatus">Firebase 연결 중...</span>
  </div>
  <div class="statusbar-divider"></div>
  <div class="statusbar-item"><span>내과 외래 · 재진</span></div>
  <div class="statusbar-divider"></div>
  <div class="statusbar-item"><span id="roomLabel">—</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-database-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBtzt-_sU8254xSSJ29jnNNpRKZz3X5nMs",
    authDomain: "sign-health.firebaseapp.com",
    databaseURL: "https://sign-health-default-rtdb.firebaseio.com",
    projectId: "sign-health",
    storageBucket: "sign-health.firebasestorage.app",
    messagingSenderId: "117629635026",
    appId: "1:117629635026:web:9d0e632ae33bec361fa00b"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // 방(Room) 설정 — URL 파라미터 ?room=팀1 로 지정, 없으면 'default'
  const roomId = new URLSearchParams(location.search).get('room') || 'default';
  const roomRef = (path) => db.ref(`rooms/${roomId}/${path}`);

  // Firebase 전송·수신 오류를 화면에 표시 (기존에는 실패해도 아무 표시가 없었음)
  let fbBlocked = false;
  function reportFbError(action, err) {
    console.error('[SignHealth]', action, err);
    const code = (err && (err.code || err.message)) || String(err);
    const denied = /permission/i.test(code);
    fbBlocked = true;
    const box = document.getElementById('fbError');
    box.innerHTML = `<b>${action} 실패</b>` + (denied
      ? 'Firebase 데이터베이스 규칙이 읽기·쓰기를 막고 있습니다. Firebase 콘솔 → Realtime Database → <code>규칙</code> 탭을 확인하세요.'
      : `오류 내용: <code>${code}</code>`);
    box.hidden = false;
    document.getElementById('fbStatus').textContent = denied ? 'Firebase 권한 거부' : 'Firebase 오류';
    document.getElementById('fbDot').classList.remove('connected');
  }
  function clearFbError() {
    if (!fbBlocked) return;
    fbBlocked = false;
    document.getElementById('fbError').hidden = true;
  }

  document.getElementById('roomLabel').textContent = roomId;

  // Firebase 연결 상태
  db.ref('.info/connected').on('value', (snap) => {
    const dot = document.getElementById('fbDot');
    const status = document.getElementById('fbStatus');
    if (fbBlocked) return;
    if (snap.val()) {
      dot.classList.add('connected');
      status.textContent = 'Firebase 연결됨';
    } else {
      dot.classList.remove('connected');
      status.textContent = 'Firebase 연결 중...';
    }
  });

  function timeStr() {
    return new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }

  // 수신 내역
  const recvHistory = [];

  // 의료진 메시지 수신

  // 새 메시지가 도착하면 칸을 잠깐 반짝이게 함 (처음 화면을 열 때 불러온 메시지는 제외)
  function flashBox(el) {
    el.classList.remove('flash');
    void el.offsetWidth;          // 애니메이션을 다시 시작하기 위한 처리
    el.classList.add('flash');
  }
  let doctorMsgLoaded = false;
  roomRef('doctor_message').on('value', (snapshot) => {
    const firstLoad = !doctorMsgLoaded;
    doctorMsgLoaded = true;
    const data = snapshot.val();
    if (!data || !data.text) return;
    const t = new Date(data.time);
    const tStr = t.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    const sender = data.sender || '의료진';
    document.querySelector('.doctor-msg-box').classList.toggle('from-nurse', sender === '간호사');
    if (!firstLoad) flashBox(document.querySelector('.doctor-msg-box'));
    const msgEl = document.getElementById('doctorMsgText');
    // Caption with Intention: 단어별 순차 애니메이션
    function renderCaption(parts) {
      // parts가 없으면 plain text를 단어 단위로 분리
      const tokens = [];
      if (parts && parts.length > 0) {
        parts.forEach(p => {
          // 각 part를 띄어쓰기 기준으로 단어 분리
          const words = p.text.split(/(\s+)/);
          words.forEach(w => tokens.push({ text: w, emph: p.emph }));
        });
      } else {
        data.text.split(/(\s+)/).forEach(w => tokens.push({ text: w, emph: false }));
      }
      let html = '';
      tokens.forEach(tok => {
        if (tok.emph && !/^\s+$/.test(tok.text)) {
          html += `<span class="emph">${tok.text}</span>`;
        } else {
          html += tok.text;
        }
      });
      msgEl.innerHTML = html;
    }
    renderCaption(data.parts);
    document.getElementById('doctorMsgTime').textContent = `${sender} · ${tStr} 수신`;

    recvHistory.unshift({ text: data.text, time: tStr, sender });
    renderRecvHistory();
  }, err => reportFbError('의료진 메시지 수신', err));

  function renderRecvHistory() {
    const el = document.getElementById('recvHistory');
    if (recvHistory.length === 0) {
      el.innerHTML = '<div style="font-size:12px;color:var(--fg4);">수신 내역 없음</div>';
      return;
    }
    el.innerHTML = recvHistory.slice(0, 8).map(item => `
      <div class="recv-row">
        <span class="recv-sender ${item.sender === '간호사' ? 'nurse' : 'doctor'}">${item.sender || '의료진'}</span>
        <span class="recv-text">${item.text}</span>
        <span class="recv-time">${item.time}</span>
      </div>
    `).join('');
  }

  // 보낸 내역
  const sentList = [];

  // ===== 문장 규칙 =====
  // words: 이 단어들이 모두 있으면 적용 (순서 무관). 단어 이름은 Teachable Machine 클래스 이름과 같아야 함.
  // base: 숫자가 없을 때 문장 / withNumber: 단위별 문장 ({n} 자리에 '3일' 등이 들어감)
  const SENTENCE_RULES = [
    // 증상 호소 (주관적 자료)
    { words: ['어지럽다'], base: '어지러워요',
      withNumber: { '일': '{n} 전부터 어지러워요', '주': '{n} 전부터 어지러워요', '번': '오늘 {n} 어지러웠어요' } },
    { words: ['어지럽다', '일어나다'], base: '일어날 때 어지러워요',
      withNumber: { '일': '{n} 전부터 일어날 때 어지러워요', '주': '{n} 전부터 일어날 때 어지러워요' } },
    { words: ['아프다'], base: '아파요', withNumber: { '점': '아파요 (통증 {n})' } },
    { words: ['두통'], base: '머리가 아파요',
      withNumber: { '일': '{n} 전부터 머리가 아파요', '시간': '{n} 전부터 머리가 아파요', '점': '머리가 아파요 (통증 {n})' } },
    { words: ['피곤'], base: '피곤해요' },
    // 질문
    { words: ['혈압', '얼마'], base: '혈압이 몇이에요?' },
    { words: ['걱정'], base: '걱정돼요' },
    // 교육 후 다시 표현 (teach-back)
    { words: ['천천히', '일어나다'], base: '천천히 일어날게요' },
    { words: ['집', '운동'], base: '집에서 운동할게요' },
    { words: ['술', '하지마'], base: '술을 안 마실게요' },
  ];
  const WORD_COOLDOWN_MS = 1000;   // 같은 단어는 중복으로 쌓지 않으므로 단어 사이 대기는 짧게

  // 환자 → 의료진 전송
  function sendPatientMessage(payload) {
    roomRef('patient_message').set({ ...payload, time: Date.now() })
      .then(clearFbError)
      .catch(err => reportFbError('메시지 전송', err));
    sentList.unshift({ text: payload.text, words: payload.words, time: timeStr() });
    renderSentHistory();
  }

  // 인식 확정된 수어 → 단어 목록에 추가 (같은 단어는 한 번만)
  let sbWords = [];
  let numDigits = '';
  let numUnit = '';
  const NUM_UNITS = ['일', '주', '시간', '번', '점'];
  const NUM_MAX_DIGITS = 3;

  function addWord(word) {
    if (sbWords.includes(word)) return false;
    sbWords.push(word);
    updateSentenceUI();
    return true;
  }

  // 단어 집합이 규칙의 단어와 정확히 일치하면 그 규칙 사용 (순서 무관)
  function findRule(words) {
    const set = new Set(words);
    return SENTENCE_RULES.find(r => r.words.length === set.size && r.words.every(w => set.has(w)));
  }

  function composeSentence() {
    const n = numDigits ? String(Number(numDigits)) + numUnit : '';   // '03일' → '3일'
    const rule = findRule(sbWords);
    if (rule) {
      if (!n) return { text: rule.base, ruled: true };
      const tpl = numUnit && rule.withNumber[numUnit];
      return { text: tpl ? tpl.replace('{n}', n) : `${rule.base} (${n})`, ruled: true };
    }
    const raw = sbWords.join(' ');
    if (!raw) return { text: n, ruled: false };
    return { text: n ? `${raw} (${n})` : raw, ruled: false };
  }

  const sbWordsEl = document.getElementById('sbWords');
  const sbPreviewEl = document.getElementById('sbPreview');
  const sbPreviewText = document.getElementById('sbPreviewText');
  const sbPreviewNote = document.getElementById('sbPreviewNote');
  const sbSendEl = document.getElementById('sbSend');

  document.getElementById('numGrid').innerHTML =
    ['1','2','3','4','5','6','7','8','9','0']
      .map(x => `<button class="num-btn" type="button" data-digit="${x}">${x}</button>`).join('');
  document.getElementById('numUnits').innerHTML =
    NUM_UNITS.map(u => `<button class="num-btn unit" type="button" data-unit="${u}">${u}</button>`).join('');

  function updateSentenceUI() {
    sbWordsEl.innerHTML = sbWords.map((w, i) =>
      `<span class="sb-chip">${w}<button type="button" data-remove="${i}" aria-label="${w} 삭제">×</button></span>`).join('');
    sbWordsEl.classList.toggle('empty', sbWords.length === 0);

    const { text, ruled } = composeSentence();
    sbPreviewText.textContent = text;
    sbPreviewEl.classList.toggle('empty', !text);
    sbPreviewNote.className = 'sb-preview-note' + (text && !ruled && sbWords.length ? ' warn' : '');
    sbPreviewNote.textContent = !text ? ''
      : ruled ? ''
      : sbWords.length ? '등록된 문장이 없어 단어를 그대로 보내요' : '';
    sbSendEl.disabled = !text;
    document.querySelectorAll('[data-unit]').forEach(b => b.classList.toggle('active', b.dataset.unit === numUnit));
  }

  function resetSentence() { sbWords = []; numDigits = ''; numUnit = ''; updateSentenceUI(); }

  sbWordsEl.addEventListener('click', e => {
    const b = e.target.closest('[data-remove]');
    if (!b) return;
    sbWords.splice(Number(b.dataset.remove), 1);
    updateSentenceUI();
  });
  document.getElementById('numGrid').addEventListener('click', e => {
    const b = e.target.closest('[data-digit]');
    if (!b || numDigits.length >= NUM_MAX_DIGITS) return;
    numDigits += b.dataset.digit;
    updateSentenceUI();
  });
  document.getElementById('numUnits').addEventListener('click', e => {
    const b = e.target.closest('[data-unit]');
    if (!b) return;
    numUnit = (numUnit === b.dataset.unit) ? '' : b.dataset.unit;   // 다시 누르면 해제
    updateSentenceUI();
  });
  // 지우기: 단위 → 숫자 → 마지막 단어 순서로 하나씩
  document.getElementById('sbBack').addEventListener('click', () => {
    if (numUnit) numUnit = '';
    else if (numDigits) numDigits = numDigits.slice(0, -1);
    else sbWords.pop();
    updateSentenceUI();
  });
  document.getElementById('sbClear').addEventListener('click', resetSentence);
  sbSendEl.addEventListener('click', () => {
    const { text } = composeSentence();
    if (!text) return;
    sendPatientMessage({ text, words: [...sbWords], number: numDigits ? String(Number(numDigits)) + numUnit : '' });
    resetSentence();
  });
  updateSentenceUI();

  function renderSentHistory() {
    const el = document.getElementById('sentHistory');
    if (sentList.length === 0) {
      el.innerHTML = '<div style="font-size:12px;color:var(--fg4);">전송 내역 없음</div>';
      return;
    }
    el.innerHTML = sentList.slice(0, 8).map(item => `
      <div class="patient-sent-row">
        <span class="patient-sent-text">${item.text}</span>
        <span class="patient-sent-meta">${item.time}${item.words && item.words.length ? ' · 인식 단어: ' + item.words.join(' · ') : ' · 숫자 입력'}</span>
      </div>
    `).join('');
  }

  // 클래스명에서 "Class N " 접두어 제거 (예: "Class 5 피로" → "피로")
  function cleanClassName(name) {
    return name.replace(/^[Cc]lass\s*\d+\s*/,'').split(/[,/]/)[0].trim();
  }

  // Teachable Machine Pose 모델
  // 포즈 모델 여러 개를 함께 사용 (각 모델에 '없음' 클래스 필요)
  const MODEL_URLS = [
    'https://teachablemachine.withgoogle.com/models/VFnakb498/',   // 모델 1 (처음 학습한 모델)
    'https://teachablemachine.withgoogle.com/models/Bcr5X8jxG/',   // 모델 2 (추가 단어)
  ];
  const CONFIDENCE_THRESHOLD = 0.80;
  const CONFIRM_FRAMES = 15;
  const COOLDOWN_MS = 5000;
  const IGNORE_CLASSES = new Set(['없음']);
  const SILHOUETTE_MIN_SCORE = 0.5;   // 코·양 어깨가 이 신뢰도 이상일 때 '사람 감지됨'

  const videoEl = document.getElementById('camera');
  let tmModel = null;        // 관절 좌표 추출에 쓰는 기준 모델
  let tmModels = [];         // 분류에 쓰는 모든 모델
  let gestureBuffer = [];
  let lastSentTime = 0;

  function setSilhouette(detected) {
    const color = detected ? '#6fe05a' : 'rgba(255,255,255,0.6)';
    document.getElementById('silhouette-head').setAttribute('stroke', color);
    document.getElementById('silhouette-shoulder').setAttribute('stroke', color);
    document.getElementById('silhouette-body').setAttribute('stroke', color);
  }

  function clearAllDots() {
    document.querySelectorAll('.gesture-status-dot').forEach(d => d.classList.remove('active'));
  }

  function setGestureDot(name, active) {
    const dot = document.getElementById('dot-' + name);
    if (dot) dot.classList.toggle('active', active);
  }

  async function initTM() {
    const recogText = document.getElementById('recogText');
    recogText.textContent = 'AI 모델 로딩 중...';
    try {
      tmModels = await Promise.all(MODEL_URLS.map(u => tmPose.load(u + 'model.json', u + 'metadata.json')));
      tmModel = tmModels[0];
      recogText.textContent = '인식 대기 중...';
      startCamera();
    } catch(e) {
      recogText.textContent = '모델 로드 실패: ' + e.message;
    }
  }

  // 여러 모델의 결과를 하나로 합침 (같은 이름이 있으면 더 높은 확률 사용)
  function mergePredictions(results) {
    const byName = new Map();
    results.flat().forEach(p => {
      const name = cleanClassName(p.className);
      const prev = byName.get(name);
      if (!prev || p.probability > prev.probability) byName.set(name, { className: p.className, probability: p.probability });
    });
    return [...byName.values()];
  }

  function updateRankList(predictions) {
    const list = document.getElementById('gestureRankList');
    if (!list) return;
    // 없음 제외 후 신뢰도 내림차순 정렬
    const sorted = predictions
      .map(p => ({ name: cleanClassName(p.className), pct: p.probability }))
      .filter(p => !IGNORE_CLASSES.has(p.name))
      .sort((a, b) => b.pct - a.pct)
      .slice(0, 5);

    list.innerHTML = sorted.map((p, i) => {
      const pctInt = Math.round(p.pct * 100);
      const isTop = i === 0;
      return `<div class="gesture-row${isTop ? ' top1' : ''}">
        <div class="gesture-status-dot${isTop && pctInt >= 50 ? ' active' : ''}"></div>
        <span class="gesture-code">${p.name}</span>
        <div class="gesture-bar-wrap"><div class="gesture-bar" style="width:${pctInt}%"></div></div>
        <span class="gesture-pct">${pctInt}%</span>
      </div>`;
    }).join('');
  }

  function startCamera() {
    navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {
      videoEl.srcObject = stream;
      videoEl.play();
      videoEl.onloadeddata = () => { loop(); };
    }).catch((err) => {
      document.getElementById('recogText').textContent = '카메라 오류: ' + err.message;
    });
  }

  async function loop() {
    if (!tmModel) return;
    const recogDot = document.getElementById('recogDot');
    const recogText = document.getElementById('recogText');
    const recogProgress = document.getElementById('recogProgress');

    // 관절 좌표는 한 번만 추출하고, 모든 모델에 같은 좌표를 넣어 분류
    const { pose, posenetOutput } = await tmModel.estimatePose(videoEl);
    const results = await Promise.all(tmModels.map(m => m.predict(posenetOutput)));
    const predictions = mergePredictions(results);

    // 실시간 순위 리스트 업데이트
    updateRankList(predictions);

    // '없음'을 제외한 단어 중 가장 높은 확률 (없으면 '없음')
    const words = predictions.filter(p => !IGNORE_CLASSES.has(cleanClassName(p.className)));
    let best = words.length ? words.reduce((a, b) => a.probability > b.probability ? a : b)
                            : { className: '없음', probability: 1 };

    // PoseNet은 사람이 없어도 관절 17개를 항상 돌려주므로, 관절별 신뢰도(score)로 실제 감지 여부를 판단
    const kp = (pose && pose.keypoints) || [];
    const seen = (part) => kp.some(k => k.part === part && k.score >= SILHOUETTE_MIN_SCORE);
    setSilhouette(seen('nose') && seen('leftShoulder') && seen('rightShoulder'));

    const bestClean = cleanClassName(best.className);
    if (best.probability >= CONFIDENCE_THRESHOLD && !IGNORE_CLASSES.has(bestClean)) {
      const gesture = bestClean;

      recogDot.className = 'recog-dot detecting';
      recogText.className = 'recog-text detecting';
      recogText.textContent = gesture;

      gestureBuffer.push(gesture);
      if (gestureBuffer.length > CONFIRM_FRAMES) gestureBuffer.shift();

      const allSame = gestureBuffer.length === CONFIRM_FRAMES &&
        gestureBuffer.every(g => g === gestureBuffer[0]);

      recogProgress.textContent = `${gestureBuffer.filter(g => g === gesture).length} / ${CONFIRM_FRAMES} 프레임`;

      if (allSame) {
        const now = Date.now();
        if (now - lastSentTime > WORD_COOLDOWN_MS) {
          lastSentTime = now;
          recogDot.className = 'recog-dot confirmed';
          recogText.className = 'recog-text confirmed';
          const added = addWord(gesture);
          recogText.textContent = added ? gesture + ' 추가됨' : gesture + ' (이미 있음)';
          recogProgress.textContent = added ? '✓ 단어 추가' : '';
        }
        gestureBuffer = [];
      }
    } else {
      recogDot.className = 'recog-dot';
      recogText.className = 'recog-text';
      if (best.probability < CONFIDENCE_THRESHOLD || IGNORE_CLASSES.has(bestClean)) {
        recogText.textContent = '인식 대기 중...';
        recogProgress.textContent = '';
      }
      gestureBuffer = [];
    }

    requestAnimationFrame(loop);
  }

  initTM();

  // 시계
  function tick() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
